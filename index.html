<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>作业帮-AI口语升级</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #e8eef7;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  /* 平板设备容器：保持外框图比例(1535/1200)，随视口缩放 */
  .device {
    position: relative;
    aspect-ratio: 1535 / 1200;
    width: min(100vw, calc(100vh * 1535 / 1200));
    max-width: 100vw; max-height: 100vh;
  }
  /* 外框图叠在最上层，透明屏幕孔露出内容，不拦截点击 */
  .device .frame {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 5;
  }
  /* 内容画布：精确定位到外框内的屏幕孔区域 */
  .canvas {
    position: absolute;
    left: 6.384%; top: 9.000%;
    width: 87.231%; height: 81.917%;
    background: #dfeaf8; overflow: hidden;
    border-radius: 2%; z-index: 1;
  }
  .view { position: absolute; inset: 0; display: none; }
  .view.active { display: block; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .layer { position: absolute; }
  .layer img { display: block; width: 100%; height: 100%; }
  /* 可滚动长卡片：裁剪可见区，内部按原比例上下滚。
     隐藏滚动条，使滚动区与外部页面贴合无缝 */
  .layer.scroll {
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;      /* Firefox */
    -ms-overflow-style: none;   /* 旧版 Edge/IE */
  }
  .layer.scroll::-webkit-scrollbar { display: none; width: 0; height: 0; }  /* Chrome/Safari */
  .layer.scroll img { height: auto; }
  .link { cursor: pointer; transition: transform .12s ease; }
  .link:hover { transform: scale(1.01); }
  .link:active { transform: scale(0.99); }

  /* ===== 方案二：手势幽灵引导 =====
     进入页面时，主要交互键上方播放"手指点击 + 涟漪扩散"引导，播放 3 轮后自动消失。
     品牌色（涟漪颜色），仅需改这里即可换色 */
  :root { --brand: 74, 125, 245; }
  /* 幽灵引导容器：绝对居中于目标按钮，不拦截点击 */
  .ghost-hint {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none; z-index: 20;
  }
  /* 涟漪：由小扩散至大并淡出 */
  .ghost-hint .ripple {
    position: absolute; left: 50%; top: 50%;
    width: 36px; height: 36px; margin: -18px 0 0 -18px;
    border-radius: 50%; background: rgba(var(--brand), 0.6);   /* 默认：蓝色涟漪，内页用 */
    animation: ghost-ripple 1.6s ease-out infinite;
  }
  /* 仅首页涟漪为白色 */
  #page0 .ghost-hint .ripple { background: rgba(255, 255, 255, 0.8); }
  @keyframes ghost-ripple {
    0%   { transform: scale(0.5); opacity: .7; }
    80%  { opacity: 0; }
    100% { transform: scale(2.6); opacity: 0; }
  }
  /* 手指图标：30% 透明度，做点击下压动作 */
  .ghost-hint .finger {
    font-size: 30px; line-height: 1; opacity: .3;
    animation: ghost-tap 1.6s ease-in-out 3;
  }
  @keyframes ghost-tap {
    0%, 100% { transform: translateY(-2px); }
    30%, 45% { transform: translateY(5px); }
  }
  /* 极短文案气泡 */
  .ghost-hint .ghost-label {
    margin-top: 4px; font-size: 12px; white-space: nowrap;
    color: rgba(60,72,98,.6); background: rgba(255,255,255,.6);
    padding: 1px 7px; border-radius: 8px;
    animation: ghost-fade 1.6s ease-in-out 3;
  }
  @keyframes ghost-fade { 0%,100%{opacity:.35;} 50%{opacity:.75;} }
  /* 目标区域轻微缩放回弹 1.03 倍 */
  .link.ghosting { animation: ghost-scale 1.6s ease-in-out infinite; }
  @keyframes ghost-scale {
    0%, 100% { transform: scale(1); }
    30%, 45% { transform: scale(1.03); }
  }

  /* ===== 热区标注：鼠标触及热区时，显示透明框 + 标注文字 =====
     交互键文字来自 labels.js 的 HOTSPOT_LABELS；
     非交互热区（普通 .layer）文字来自 HOTSPOT_NOTES，均可直接改文件后刷新 */
  /* 标注框：定位在热区外部正下方，居中对齐 */
  .layer .hotspot-box {
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%);
    margin-top: 2px;
    opacity: 0; transition: opacity .15s ease;
    pointer-events: none; z-index: 30;
  }
  .layer:hover > .hotspot-box { opacity: 1; }
  /* 标注方向变体：默认在下方；标注文字结尾加 @right/@left/@top 可改到右/左/上方。
     在 labels.js 的标注文字末尾写 " @right" 即用对应变体。 */
  .layer .hotspot-box.hotspot-box--right {
    top: 50%; left: 100%; transform: translateY(-50%);
    margin: 0 0 0 6px;
  }
  .layer .hotspot-box.hotspot-box--left {
    top: 50%; left: auto; right: 100%; transform: translateY(-50%);
    margin: 0 6px 0 0;
  }
  .layer .hotspot-box.hotspot-box--top {
    top: auto; bottom: 100%; left: 50%; transform: translateX(-50%);
    margin: 0 0 2px 0;
  }
  /* 非交互热区带标注时，用 "help" 光标提示可查看说明（区别于交互键的手型） */
  .layer.noted { cursor: help; }
  .layer .hotspot-box .hotspot-label {
    display: inline-block;
    font-size: 12px; line-height: 1.2; color: #000;
    background: rgba(255, 255, 255, .6);
    padding: 3px 9px; border-radius: 6px; white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  /* 右下角水印标注：固定在画布内，覆盖所有页面，随画布缩放 */
  .watermark {
    position: absolute; left: 50%; bottom: 1.5%;
    transform: translateX(-50%);
    color: #9aa3b0; font-size: 14px; letter-spacing: .5px;
    pointer-events: none; user-select: none; z-index: 10;
    text-shadow: 0 1px 2px rgba(255,255,255,0.5);
    white-space: nowrap;
  }
</style>
</head>

      <div class="layer link" style="left:27.24%; top:88.79%; width:20.53%; height:7.00%;" onclick="showView('p4-2')">
        <img src="images/4-273.png" alt="" />
      </div>
      <div class="layer scroll" style="left:50.67%; top:19.83%; width:46.17%; height:61.79%; overflow-y:auto;">
        <img src="images/3-274.png" alt="" style="width:100%;height:auto;" />
      </div>
      <div class="layer scroll" style="left:3.16%; top:19.83%; width:46.17%; height:61.79%; overflow-y:auto;">
        <img src="images/2-275.png" alt="" style="width:100%;height:auto;" />
      </div>
      <div class="layer link" style="left:4.01%; top:5.75%; width:1.19%; height:2.79%;" onclick="showView('p4-2')">
        <img src="images/1-276.png" alt="" />
      </div>
    </section>

    <!-- 右下角标注：置于所有页面之上，全局显示 -->
    <div class="watermark">本项目仅作为作品展示，非商用</div>
  </div>
  <!-- 平板外框：叠加在内容之上 -->
  <img class="frame" src="平板外框.png" alt="" />
  </div>
</div>
<script src="labels.js"></script>
<script>
  // 视图切换：显示 id 对应页面，其余隐藏；切换后回到顶部
  function showView(id) {
    var el = document.getElementById(id);
    if (!el) return;
    document.querySelectorAll('.view').forEach(function (v) {
      v.classList.toggle('active', v === el);
    });
    el.querySelectorAll('.scroll').forEach(function (s) { s.scrollTop = 0; });
    // 滚动卡片内的标注热区：页面显示后图片才有高度，重新按比例定位
    el.querySelectorAll('.layer.noted').forEach(function (n) { if (n._place) n._place(); });
    playGhostHints(el);   // 方案二：进入页面时播放手势幽灵引导
  }

  /* ===== 方案二：手势幽灵引导 =====
     在当前页"主要交互键"上生成手指点击 + 涟漪动画，播放 3 轮后自动移除。
     GHOST_LABEL 置空则不显示文案；GHOST_MIN_WIDTH 过滤掉过小的按钮（如返回箭头） */
  var GHOST_LABEL = '';           // 极短文案，不需要可改成 ''
  var GHOST_MIN_WIDTH = 0;        // 0 = 所有交互键都显示涟漪（含返回键、下拉键等小图标）
  var GHOST_DURATION = 1.6 * 3 * 1000 + 400;  // 3 轮总时长 + 缓冲

  function playGhostHints(view) {
    // 先清掉上一轮残留
    view.querySelectorAll('.ghost-hint').forEach(function (g) { g.remove(); });
    view.querySelectorAll('.link.ghosting').forEach(function (l) { l.classList.remove('ghosting'); });

    var links = view.querySelectorAll('.link[onclick]');
    links.forEach(function (link) {
      var w = parseFloat(link.style.width) || 0;
      if (w < GHOST_MIN_WIDTH) return;   // 跳过过小的按钮

      link.classList.add('ghosting');
      var hint = document.createElement('div');
      hint.className = 'ghost-hint';
      hint.innerHTML =
        '<span class="ripple"></span>' +
        (GHOST_LABEL ? '<span class="ghost-label">' + GHOST_LABEL + '</span>' : '');
      link.appendChild(hint);
    });
    // 涟漪持续循环显示，切换页面时才在下次 playGhostHints 开头被清除重建
  }

  // 给某个热区元素挂上标注框；text 为空或 "/" 则不挂。
  // 文字末尾可加方向后缀控制标注位置：@right 右侧 / @left 左侧 / @top 上方（默认下方）。
  function addHotspotBox(el, text) {
    if (!text || text.trim() === '/') return;
    var dir = '';
    var m = text.match(/\s*@(right|left|top|bottom)\s*$/);
    if (m) { dir = m[1]; text = text.slice(0, m.index); }   // 剥离后缀，只显示纯文字
    if (!text.trim()) return;
    var box = document.createElement('div');
    box.className = 'hotspot-box' + (dir && dir !== 'bottom' ? ' hotspot-box--' + dir : '');
    var label = document.createElement('span');
    label.className = 'hotspot-label';
    // 文字里的 \n 渲染成换行，可写多行标注
    text.split('\n').forEach(function (line, i) {
      if (i) label.appendChild(document.createElement('br'));
      label.appendChild(document.createTextNode(line));
    });
    box.appendChild(label);
    el.appendChild(box);
  }

  /* ===== 交互键标注：为每个交互键注入"透明框 + 标注文字" =====
     标注按 页面id#序号 从 labels.js(window.HOTSPOT_LABELS) 读取，找不到则回退为"标注" */
  function buildHotspotBoxes() {
    var labels = window.HOTSPOT_LABELS || {};
    document.querySelectorAll('.view').forEach(function (view) {
      var pageId = view.id;
      view.querySelectorAll('.link[onclick]').forEach(function (link, i) {
        addHotspotBox(link, labels[pageId + '#' + (i + 1)] || '标注');
      });
    });
  }

  /* ===== 非交互热区标注：按坐标在背景图上圈定区域，触及显示标注 =====
     用于金币框等"画在背景里、无独立图层"的元素。数据来自 labels.js(window.HOTSPOT_AREAS)。
     每页一个数组，元素形如 { left, top, width, height, text }，坐标为相对画布的百分比 */
  function buildHotspotAreas() {
    var areas = window.HOTSPOT_AREAS || {};
    document.querySelectorAll('.view').forEach(function (view) {
      var list = areas[view.id];
      if (!list) return;
      var scrolls = view.querySelectorAll('.layer.scroll');   // 该页的滚动卡片，按 DOM 顺序
      list.forEach(function (a) {
        if (!a || !a.text || a.text.trim() === '/') return;
        var el = document.createElement('div');
        el.className = 'layer noted';   // 复用 .layer 定位与 .noted 的 help 光标
        el.style.left = a.left; el.style.width = a.width;
        addHotspotBox(el, a.text);

        if (a.scroll != null && scrolls[a.scroll]) {
          // 滚动卡片内热区：挂进卡片随内容滚动。left/width 按卡片宽度百分比即可；
          // top/height 按图片高度比例，用 JS 换算成 px（图片 height:auto，随宽度缩放）。
          var layer = scrolls[a.scroll];
          var img = layer.querySelector('img');
          el.style.position = 'absolute';
          el.dataset.topFrac = parseFloat(a.top) / 100;
          el.dataset.hFrac = parseFloat(a.height) / 100;
          layer.appendChild(el);
          // 存到元素上，便于切页时重新定位（隐藏页图片高度为 0，需在显示后再算一次）
          el._place = function () {
            var h = img.getBoundingClientRect().height || img.offsetHeight;
            if (!h) return;
            el.style.top = (h * parseFloat(el.dataset.topFrac)) + 'px';
            el.style.height = (h * parseFloat(el.dataset.hFrac)) + 'px';
          };
          if (img.complete) el._place(); else img.addEventListener('load', el._place);
          window.addEventListener('resize', el._place);
        } else {
          // 背景上的热区：直接按画布百分比定位
          el.style.top = a.top; el.style.height = a.height;
          view.appendChild(el);
        }
      });
    });
  }

  // 首屏进入时：构建标注框，并对默认激活页播放一次引导
  document.addEventListener('DOMContentLoaded', function () {
    buildHotspotBoxes();
    buildHotspotAreas();
    var first = document.querySelector('.view.active');
    if (first) playGhostHints(first);
  });

  // 底部阈值：滚动区剩余 30px 时即视为到底，不再继续滚动，
  // 避免长图底部圆角与外部圆角矩形区域重叠。
  var SCROLL_BOTTOM_GAP = 30;
  document.querySelectorAll('.layer.scroll').forEach(function (s) {
    s.addEventListener('scroll', function () {
      var max = s.scrollHeight - s.clientHeight - SCROLL_BOTTOM_GAP;
      if (max > 0 && s.scrollTop > max) s.scrollTop = max;
    });
  });
</script>
</body>
</html>
